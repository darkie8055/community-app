name: mycommunity
description: MyCommunity resident and guard applications.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  mobile_scanner: ^7.4.3
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.2
  intl: ^0.20.2
  image_picker: ^1.2.1
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_crashlytics: ^5.0.5
  firebase_auth: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
